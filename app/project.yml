name: RubiksCubeSolver
options:
  bundleIdPrefix: com.pathe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  RubiksCubeSolver:
    type: application
    platform: iOS
    sources:
      - path: RubiksCubeSolver
        excludes:
          - App/Info.plist
          - Resources/**
    resources:
      - path: RubiksCubeSolver/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pathe.RubiksCubeSolver
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RubiksCubeSolver/App/Info.plist
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
  RubiksCubeSolverTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RubiksCubeSolverTests
    dependencies:
      - target: RubiksCubeSolver
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pathe.RubiksCubeSolverTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RubiksCubeSolver:
    build:
      targets:
        RubiksCubeSolver: all
        RubiksCubeSolverTests: [test]
    test:
      targets:
        - RubiksCubeSolverTests
    run:
      config: Debug
    archive:
      config: Release
